services:
  db:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retrovault}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retrovault-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-retrovault}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [retrovault-db:/var/lib/postgresql]
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-retrovault-local}@db:5432/${POSTGRES_DB:-retrovault}
      RETROACHIEVEMENTS_API_KEY: ${RETROACHIEVEMENTS_API_KEY:-${RETRO_ACHIEVEMENTS_KEY:-}}
      RETROACHIEVEMENTS_CACHE_DIR: /var/lib/retrovault/retroachievements-cache
      PIXEL_TELEGRAM_BOT_TOKEN: ${PIXEL_TELEGRAM_BOT_TOKEN:-}
      PIXEL_TELEGRAM_BOT_USERNAME: ${PIXEL_TELEGRAM_BOT_USERNAME:-}
      PIXEL_TELEGRAM_WEBHOOK_SECRET: ${PIXEL_TELEGRAM_WEBHOOK_SECRET:-}
      PIXEL_TELEGRAM_ALLOWED_USER_IDS: ${PIXEL_TELEGRAM_ALLOWED_USER_IDS:-}
      PIXEL_TELEGRAM_WEBHOOK_MAX_BODY_BYTES: ${PIXEL_TELEGRAM_WEBHOOK_MAX_BODY_BYTES:-65536}
      PIXEL_TELEGRAM_MESSAGE_MAX_AGE_SECONDS: ${PIXEL_TELEGRAM_MESSAGE_MAX_AGE_SECONDS:-900}
      PIXEL_TELEGRAM_RETENTION_DAYS: ${PIXEL_TELEGRAM_RETENTION_DAYS:-30}
      PIXEL_TELEGRAM_TYPING_THRESHOLD_SECONDS: ${PIXEL_TELEGRAM_TYPING_THRESHOLD_SECONDS:-3}
      PIXEL_CONTEXT_REFERENCE_SECRET: ${PIXEL_CONTEXT_REFERENCE_SECRET:-}
      PIXEL_CONTEXT_REFERENCE_TTL_SECONDS: ${PIXEL_CONTEXT_REFERENCE_TTL_SECONDS:-1800}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PIXEL_OPENAI_MODEL_SNAPSHOT: ${PIXEL_OPENAI_MODEL_SNAPSHOT:-}
      PIXEL_AI_CONFIGURATION_VERSION: ${PIXEL_AI_CONFIGURATION_VERSION:-intent-config.v1}
      PIXEL_AI_INPUT_USD_PER_MILLION_TOKENS: ${PIXEL_AI_INPUT_USD_PER_MILLION_TOKENS:-0}
      PIXEL_AI_OUTPUT_USD_PER_MILLION_TOKENS: ${PIXEL_AI_OUTPUT_USD_PER_MILLION_TOKENS:-0}
      PIXEL_AI_MAX_INPUT_TOKENS: ${PIXEL_AI_MAX_INPUT_TOKENS:-20000}
      PIXEL_AI_MAX_OUTPUT_TOKENS: ${PIXEL_AI_MAX_OUTPUT_TOKENS:-300}
      PIXEL_AI_MONTHLY_BUDGET_USD: ${PIXEL_AI_MONTHLY_BUDGET_USD:-25}
      PIXEL_AI_RESERVATION_TTL_SECONDS: ${PIXEL_AI_RESERVATION_TTL_SECONDS:-900}
      PIXEL_AI_LEDGER_RETENTION_DAYS: ${PIXEL_AI_LEDGER_RETENTION_DAYS:-180}
    volumes:
      - retroachievements-cache:/var/lib/retrovault/retroachievements-cache
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed-sandbox-commerce.py && exec fastapi run --host 0.0.0.0"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
  frontend:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    working_dir: /workspace/frontend
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run dev --host 0.0.0.0"]
    volumes:
      - ".:/workspace"
      - "frontend-node-modules:/workspace/frontend/node_modules"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_APP_VERSION: ${APP_VERSION:-dev}
    ports: ["127.0.0.1:5173:5173"]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      backend: {condition: service_healthy}
  frontend-lcp:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    working_dir: /workspace/frontend
    command:
      ["sh", "-c", "bun install --frozen-lockfile && bun run build && bun run preview --host 0.0.0.0 --port 4173"]
    volumes:
      - ".:/workspace"
      - "frontend-lcp-node-modules:/workspace/frontend/node_modules"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_APP_VERSION: ${APP_VERSION:-dev}
      VITE_BUILD_OUT_DIR: /tmp/retrovault-lcp-dist
    ports: ["127.0.0.1:4173:4173"]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4173').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      backend: {condition: service_healthy}
volumes:
  retrovault-db:
  retroachievements-cache:
  frontend-node-modules:
  frontend-lcp-node-modules:
